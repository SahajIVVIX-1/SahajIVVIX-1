name: README build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Generate motion graphics
        run: python assets/motion/generate.py

      - name: Update README statistics
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit generated changes
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md dark_mode.svg light_mode.svg cache/ assets/motion/
          git diff --cached --quiet || git commit -m "chore: update profile"
          git push
