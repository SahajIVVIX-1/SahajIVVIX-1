name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telemetry
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update telemetry and insights
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME || github.repository_owner }}
        run: |
          python today.py
          python assets/build/insights.py
      - name: Commit
        run: |-
          git add dark_mode.svg light_mode.svg assets/hero-dark.svg assets/hero-light.svg assets/insights-dark.svg assets/insights-light.svg cache/
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh telemetry card" || echo "No changes to commit"
          git push
